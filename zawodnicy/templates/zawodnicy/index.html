<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Baza Koszykarzy</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; }
        .karta-zawodnika { background: white; border: 2px solid #ff7b00; border-radius: 8px; padding: 15px; margin-bottom: 15px; max-width: 400px; }
        h1 { color: #333; }
        .info { color: #555; margin: 5px 0; }
        #komunikat { font-weight: bold; color: #0066cc; margin-top: 10px; }
        #blad { color: red; margin-top: 10px; font-weight: bold; }
        button { background-color: #ff7b00; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; }
        button:hover { background-color: #e66a00; }
    </style>
</head>
<body>
    <h1>Baza Zawodników Koszykówki</h1>
    <p>Statystyki i informacje o graczach pobierane z API.</p>
    <label for="filtr">Status gracza:</label>
    <select id="filtr">
        <option value="all">Wszyscy</option>
        <option value="true">Tylko aktywni</option>
        <option value="false">Nieaktywni / Zakończona kariera</option>
    </select>
    <button id="wczytaj">Pobierz statystyki</button>
    <div id="komunikat"></div>
    <div id="blad"></div>
    <div id="wyniki" style="margin-top: 20px;"></div>
    <script>
        document.getElementById('wczytaj').addEventListener('click', function() {
            const komunikat = document.getElementById('komunikat');
            const blad = document.getElementById('blad');
            const wyniki = document.getElementById('wyniki');
            const filtrValue = document.getElementById('filtr').value;

            komunikat.textContent = 'Trwa pobieranie danych z parkietu...';
            blad.textContent = '';
            wyniki.innerHTML = '';

            let url = '/api/obiekty/';
            if (filtrValue !== 'all') {
                url += '?aktywny=' + filtrValue;
            }

            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Błąd serwera');
                    }
                    return response.json();
                })
                .then(data => {
                    komunikat.textContent = '';
                    if (data.items.length === 0) {
                        wyniki.textContent = 'Brak zawodników spełniających kryteria.';
                        return;
                    }
                    data.items.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'karta-zawodnika';
                        const nazwa = document.createElement('h3');
                        nazwa.textContent = item.imie_nazwisko + ' #' + item.numer_koszulki;
                        nazwa.style.margin = '0 0 10px 0';
                        const zespol = document.createElement('div');
                        zespol.className = 'info';
                        zespol.textContent = 'Drużyna: ' + item.druzyna;
                        const pozycja = document.createElement('div');
                        pozycja.className = 'info';
                        pozycja.textContent = 'Pozycja: ' + item.pozycja;
                        const status = document.createElement('div');
                        status.className = 'info';
                        status.textContent = 'Aktywny w grze: ' + (item.aktywny ? 'Tak' : 'Nie');
                        div.appendChild(nazwa);
                        div.appendChild(zespol);
                        div.appendChild(pozycja);
                        div.appendChild(status);
                        wyniki.appendChild(div);
                    });
                })
                .catch(error => {
                    komunikat.textContent = '';
                    blad.textContent = 'Wystąpił problem z połączeniem lub API.';
                });
        });
    </script>
</body>
</html>
